version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: talent_intelligence_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=production-secure-key-replace-in-env-987654321
      - DATABASE_URL=sqlite:////app/data/platform.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: talent_intelligence_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
